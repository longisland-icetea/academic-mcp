name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # The browser fallback is optional at import time; skip it in CI.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --no-deps
          pip install mcp httpx ddgs python-docx jinja2 pydantic pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
